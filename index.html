<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DataOnline Admin Panel</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
    -webkit-user-select:none;
    user-select:none;
}

body{
    background:#f4f6f8;
    color:#222;
}

input,
select,
textarea{
    -webkit-user-select:text;
    user-select:text;
}

.header{
    background:#111;
    color:white;
    text-align:center;
    padding:18px 15px;
}

.header h1{
    font-size:23px;
}

.header p{
    color:#aaa;
    font-size:12px;
    margin-top:4px;
}

.container{
    width:94%;
    max-width:850px;
    margin:18px auto;
}

.menu-buttons{
    display:flex;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
    margin-bottom:15px;
}

.menu-buttons::-webkit-scrollbar{
    display:none;
}

.menu-btn,
.calculate-btn{
    border:0;
    border-radius:7px;
    padding:11px 16px;
    font-size:13px;
    font-weight:bold;
    white-space:nowrap;
    cursor:pointer;
}

.menu-btn{
    background:white;
    color:#222;
    box-shadow:0 2px 7px rgba(0,0,0,.07);
}

.menu-btn.active{
    background:#111;
    color:white;
}

.calculate-btn{
    background:#ffd83d;
    color:#111;
}

.card{
    background:white;
    border-radius:11px;
    padding:16px;
    margin-top:16px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.card h2{
    font-size:18px;
    margin-bottom:14px;
}

.input-group{
    margin-bottom:13px;
}

.input-group label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}

.input-group input{
    width:100%;
    padding:11px;
    border:1px solid #ddd;
    border-radius:7px;
    outline:none;
    font-size:14px;
}

.input-group input:focus{
    border-color:#111;
}

.save-btn{
    width:100%;
    border:0;
    background:#111;
    color:white;
    padding:12px;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
}

.package{
    background:#fafafa;
    border:1px solid #e8e8e8;
    border-radius:8px;
    padding:12px;
    margin-top:9px;
}

.package-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.package-name{
    font-size:14px;
    font-weight:bold;
    flex:1;
}

.package-actions{
    display:flex;
    gap:5px;
    flex-shrink:0;
}

.edit-btn{
    border:0;
    background:#111;
    color:white;
    padding:6px 9px;
    border-radius:5px;
    font-size:11px;
    font-weight:bold;
    cursor:pointer;
}

.delete-btn{
    border:0;
    background:#ff4141;
    color:white;
    padding:6px 9px;
    border-radius:5px;
    font-size:11px;
    font-weight:bold;
    cursor:pointer;
}

.package-details{
    margin-top:7px;
    font-size:12px;
    color:#555;
    line-height:1.8;
}

.offer-badge{
    display:inline-block;
    background:#e8f7e8;
    color:#168016;
    padding:2px 6px;
    border-radius:4px;
    font-size:11px;
    font-weight:bold;
}

.edit-area{
    margin-top:10px;
    padding:10px;
    background:white;
    border:1px solid #ddd;
    border-radius:7px;
}

.edit-group{
    margin-bottom:9px;
}

.edit-group label{
    display:block;
    font-size:11px;
    font-weight:bold;
    margin-bottom:4px;
    color:#555;
}

.edit-group input{
    width:100%;
    padding:9px;
    border:1px solid #ddd;
    border-radius:6px;
    outline:none;
    font-size:13px;
    user-select:text;
    -webkit-user-select:text;
}

.edit-buttons{
    display:flex;
    gap:7px;
    margin-top:8px;
}

.update-btn{
    flex:1;
    border:0;
    background:#111;
    color:white;
    padding:9px;
    border-radius:6px;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
}

.cancel-btn{
    flex:1;
    border:0;
    background:#e8e8e8;
    color:#222;
    padding:9px;
    border-radius:6px;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
}

/* CALCULATOR */

#calculatorView{
    display:none;
}

#calculatorView.show{
    display:block;
}

#mainView.hide{
    display:none;
}

.back-btn{
    border:0;
    background:#111;
    color:white;
    padding:9px 14px;
    border-radius:7px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:13px;
}

.calculator-card{
    background:white;
    border-radius:11px;
    padding:17px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.calculator-card h2{
    font-size:19px;
    margin-bottom:15px;
}

.calc-group{
    margin-bottom:13px;
}

.calc-group label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}

.calc-group input{
    width:100%;
    padding:11px;
    border:1px solid #ddd;
    border-radius:7px;
    outline:none;
    font-size:14px;
}

.calc-button{
    width:100%;
    border:0;
    background:#ffd83d;
    color:#111;
    padding:12px;
    border-radius:7px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.result-box{
    margin-top:14px;
    padding:13px;
    background:#f5f5f5;
    border-radius:8px;
    font-size:13px;
    line-height:1.8;
}

.discount-big{
    font-size:20px;
    font-weight:bold;
}

.saved-big{
    font-weight:bold;
}

@media(max-width:600px){

    .container{
        width:94%;
    }

    .menu-btn,
    .calculate-btn{
        padding:9px 12px;
        font-size:12px;
    }

    .card{
        padding:14px;
    }

}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

    <h1>DataOnline Admin Panel</h1>

    <p>Manage Packages & Offers</p>

</div>


<!-- MAIN -->

<div id="mainView">

<div class="container">


<!-- MENU -->

<div class="menu-buttons">

    <button
        class="menu-btn active"
        onclick="showPackages()">

        Our Packages

    </button>

    <button
        class="calculate-btn"
        onclick="openCalculator()">

        Offer Calculator

    </button>

</div>


<!-- ADD PACKAGE -->

<div class="card">

    <h2>
        Add Our Package
    </h2>


    <!-- PACKAGE NAME -->

    <div class="input-group">

        <label>
            Package Name
        </label>

        <input
            type="text"
            id="packageName"
            placeholder="Example: Package 1"
            autocomplete="off">

    </div>


    <!-- VIEWS -->

    <div class="input-group">

        <label>
            Views
        </label>

        <input
            type="text"
            id="views"
            placeholder="Example: 100K"
            autocomplete="off">

    </div>


    <!-- LIKES -->

    <div class="input-group">

        <label>
            Likes
        </label>

        <input
            type="text"
            id="likes"
            placeholder="Example: 5K"
            autocomplete="off">

    </div>


    <!-- SHARES -->

    <div class="input-group">

        <label>
            Shares
        </label>

        <input
            type="text"
            id="shares"
            placeholder="Example: 3K"
            autocomplete="off">

    </div>


    <!-- PRICE -->

    <div class="input-group">

        <label>
            Price (₹)
        </label>

        <input
            type="text"
            id="price"
            placeholder="Example: 199"
            autocomplete="off">

    </div>


    <!-- OFFER -->

    <div class="input-group">

        <label>
            Offer (%)
        </label>

        <input
            type="text"
            id="offer"
            placeholder="Example: 20"
            autocomplete="off">

    </div>


    <button
        class="save-btn"
        onclick="savePackage()">

        Save Package

    </button>

</div>


<!-- PACKAGE LIST -->

<div class="card">

    <h2>
        Our Packages
    </h2>

    <div id="packageList">
        Loading...
    </div>

</div>

</div>

</div>


<!-- CALCULATOR -->

<div id="calculatorView">

<div class="container">

<button
    class="back-btn"
    onclick="closeCalculator()">

    ← Back

</button>


<div class="calculator-card">

    <h2>
        Offer Calculator
    </h2>


    <div class="calc-group">

        <label>
            Rate Per
        </label>

        <input
            type="text"
            id="ratePer"
            placeholder="Example: 1K">

    </div>


    <div class="calc-group">

        <label>
            Price For Rate (₹)
        </label>

        <input
            type="text"
            id="normalRate"
            placeholder="Example: 10">

    </div>


    <div class="calc-group">

        <label>
            Customer Quantity
        </label>

        <input
            type="text"
            id="calcQuantity"
            placeholder="Example: 100K">

    </div>


    <div class="calc-group">

        <label>
            Set Price (₹)
        </label>

        <input
            type="text"
            id="setPrice"
            placeholder="Example: 199">

    </div>


    <button
        class="calc-button"
        onclick="calculateDiscount()">

        Calculate Offer

    </button>


    <div
        class="result-box"
        id="calculatorResult">

        Enter the values.

    </div>

</div>

</div>

</div>


<script>

/* =================================
   FIREBASE
================================= */

const DATABASE_URL =
"https://datacash-95a80-default-rtdb.firebaseio.com";


/* =================================
   SAVE PACKAGE
================================= */

async function savePackage(){

    const packageName =
    document.getElementById("packageName")
    .value.trim();

    const views =
    document.getElementById("views")
    .value.trim();

    const likes =
    document.getElementById("likes")
    .value.trim();

    const shares =
    document.getElementById("shares")
    .value.trim();

    const price =
    document.getElementById("price")
    .value.trim();

    const offer =
    document.getElementById("offer")
    .value.trim();


    if(!packageName){
        alert("Package Name is required.");
        return;
    }

    if(!views){
        alert("Views is required.");
        return;
    }

    if(!likes){
        alert("Likes is required.");
        return;
    }

    if(!shares){
        alert("Shares is required.");
        return;
    }

    if(!price){
        alert("Price is required.");
        return;
    }

    if(!offer){
        alert("Offer is required.");
        return;
    }


    const packageData = {

        packageName:packageName,

        views:views,

        likes:likes,

        shares:shares,

        price:price,

        offer:offer,

        createdAt:Date.now()

    };


    try{

        const response =
        await fetch(

            `${DATABASE_URL}/packages.json`,

            {

                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:
                JSON.stringify(packageData)

            }

        );


        if(!response.ok){
            throw new Error("Save failed");
        }


        alert(
            "Package Saved Successfully."
        );


        clearAddForm();

        loadPackages();

    }

    catch(error){

        console.error(error);

        alert(
            "Package save failed. Check Firebase Rules."
        );

    }

}


/* =================================
   CLEAR FORM
================================= */

function clearAddForm(){

    document.getElementById(
        "packageName"
    ).value="";

    document.getElementById(
        "views"
    ).value="";

    document.getElementById(
        "likes"
    ).value="";

    document.getElementById(
        "shares"
    ).value="";

    document.getElementById(
        "price"
    ).value="";

    document.getElementById(
        "offer"
    ).value="";

}


/* =================================
   LOAD PACKAGES
================================= */

async function loadPackages(){

    const list =
    document.getElementById(
        "packageList"
    );

    list.innerHTML =
    "Loading...";


    try{

        const response =
        await fetch(

            `${DATABASE_URL}/packages.json`,

            {
                cache:"no-store"
            }

        );


        if(!response.ok){
            throw new Error("Load failed");
        }


        const data =
        await response.json();


        list.innerHTML="";


        if(!data){

            list.innerHTML =
            "<p>No packages.</p>";

            return;

        }


        const packages =
        Object.entries(data).reverse();


        packages.forEach(
        function([id,item]){

            const div =
            document.createElement("div");

            div.className =
            "package";


            const name =
            escapeHTML(
                item.packageName || ""
            );

            const views =
            escapeHTML(
                item.views || ""
            );

            const likes =
            escapeHTML(
                item.likes || ""
            );

            const shares =
            escapeHTML(
                item.shares || ""
            );

            const price =
            escapeHTML(
                item.price || ""
            );

            const offer =
            escapeHTML(
                item.offer || ""
            );


            div.innerHTML = `

                <div class="package-top">

                    <div class="package-name">
                        ${name}
                    </div>

                    <div class="package-actions">

                        <button
                            class="edit-btn"
                            onclick="showEdit('${id}')">

                            Edit

                        </button>

                        <button
                            class="delete-btn"
                            onclick="deletePackage('${id}')">

                            Delete

                        </button>

                    </div>

                </div>


                <div
                    class="package-details"
                    id="details-${id}">

                    Views:
                    <b>${views}</b>

                    <br>

                    Likes:
                    <b>${likes}</b>

                    <br>

                    Shares:
                    <b>${shares}</b>

                    <br>

                    Price:
                    <b>₹${price}</b>

                    <br>

                    <span class="offer-badge">

                        ${offer}% Offer

                    </span>

                </div>


                <!-- EDIT AREA -->

                <div
                    class="edit-area"
                    id="edit-${id}"
                    style="display:none;">


                    <div class="edit-group">

                        <label>
                            Package Name
                        </label>

                        <input
                            type="text"
                            id="editName-${id}"
                            value="${escapeAttribute(
                                item.packageName || ""
                            )}">

                    </div>


                    <div class="edit-group">

                        <label>
                            Views
                        </label>

                        <input
                            type="text"
                            id="editViews-${id}"
                            value="${escapeAttribute(
                                item.views || ""
                            )}">

                    </div>


                    <div class="edit-group">

                        <label>
                            Likes
                        </label>

                        <input
                            type="text"
                            id="editLikes-${id}"
                            value="${escapeAttribute(
                                item.likes || ""
                            )}">

                    </div>


                    <div class="edit-group">

                        <label>
                            Shares
                        </label>

                        <input
                            type="text"
                            id="editShares-${id}"
                            value="${escapeAttribute(
                                item.shares || ""
                            )}">

                    </div>


                    <div class="edit-group">

                        <label>
                            Price (₹)
                        </label>

                        <input
                            type="text"
                            id="editPrice-${id}"
                            value="${escapeAttribute(
                                item.price || ""
                            )}">

                    </div>


                    <div class="edit-group">

                        <label>
                            Offer (%)
                        </label>

                        <input
                            type="text"
                            id="editOffer-${id}"
                            value="${escapeAttribute(
                                item.offer || ""
                            )}">

                    </div>


                    <div class="edit-buttons">

                        <button
                            class="update-btn"
                            onclick="updatePackage('${id}')">

                            Save Changes

                        </button>


                        <button
                            class="cancel-btn"
                            onclick="cancelEdit('${id}')">

                            Cancel

                        </button>

                    </div>

                </div>

            `;


            list.appendChild(div);

        });

    }

    catch(error){

        console.error(error);

        list.innerHTML =
        "<p>Failed to load packages.</p>";

    }

}


/* =================================
   SHOW EDIT
================================= */

function showEdit(id){

    const editBox =
    document.getElementById(
        "edit-" + id
    );

    const details =
    document.getElementById(
        "details-" + id
    );


    if(editBox){
        editBox.style.display="block";
    }

    if(details){
        details.style.display="none";
    }

}


/* =================================
   CANCEL EDIT
================================= */

function cancelEdit(id){

    const editBox =
    document.getElementById(
        "edit-" + id
    );

    const details =
    document.getElementById(
        "details-" + id
    );


    if(editBox){
        editBox.style.display="none";
    }

    if(details){
        details.style.display="block";
    }

}


/* =================================
   UPDATE PACKAGE
================================= */

async function updatePackage(id){

    const packageName =
    document.getElementById(
        "editName-" + id
    ).value.trim();

    const views =
    document.getElementById(
        "editViews-" + id
    ).value.trim();

    const likes =
    document.getElementById(
        "editLikes-" + id
    ).value.trim();

    const shares =
    document.getElementById(
        "editShares-" + id
    ).value.trim();

    const price =
    document.getElementById(
        "editPrice-" + id
    ).value.trim();

    const offer =
    document.getElementById(
        "editOffer-" + id
    ).value.trim();


    if(
        !packageName ||
        !views ||
        !likes ||
        !shares ||
        !price ||
        !offer
    ){

        alert(
            "Please fill all fields."
        );

        return;

    }


    const updateData = {

        packageName:packageName,

        views:views,

        likes:likes,

        shares:shares,

        price:price,

        offer:offer

    };


    try{

        const response =
        await fetch(

            `${DATABASE_URL}/packages/${id}.json`,

            {

                method:"PATCH",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:
                JSON.stringify(updateData)

            }

        );


        if(!response.ok){
            throw new Error(
                "Update failed"
            );
        }


        alert(
            "Package Updated Successfully."
        );


        loadPackages();

    }

    catch(error){

        console.error(error);

        alert(
            "Update failed. Check Firebase Rules."
        );

    }

}


/* =================================
   DELETE PACKAGE
================================= */

async function deletePackage(id){

    if(
        !confirm(
            "Delete this package?"
        )
    ){
        return;
    }


    try{

        const response =
        await fetch(

            `${DATABASE_URL}/packages/${id}.json`,

            {
                method:"DELETE"
            }

        );


        if(!response.ok){
            throw new Error(
                "Delete failed"
            );
        }


        loadPackages();

    }

    catch(error){

        console.error(error);

        alert(
            "Delete failed. Check Firebase Rules."
        );

    }

}


/* =================================
   PACKAGE VIEW
================================= */

function showPackages(){

    document
    .getElementById("calculatorView")
    .classList.remove("show");

    document
    .getElementById("mainView")
    .classList.remove("hide");

    window.scrollTo(0,0);

}


/* =================================
   OPEN CALCULATOR
================================= */

function openCalculator(){

    document
    .getElementById("mainView")
    .classList.add("hide");

    document
    .getElementById("calculatorView")
    .classList.add("show");

    window.scrollTo(0,0);

}


/* =================================
   CLOSE CALCULATOR
================================= */

function closeCalculator(){

    document
    .getElementById("calculatorView")
    .classList.remove("show");

    document
    .getElementById("mainView")
    .classList.remove("hide");

    window.scrollTo(0,0);

}


/* =================================
   QUANTITY CONVERTER
================================= */

function convertQuantity(value){

    value =
    value
    .toUpperCase()
    .replace(/,/g,"")
    .trim();


    let numberPart=value;
    let multiplier=1;


    if(value.endsWith("K")){

        numberPart =
        value.substring(
            0,
            value.length-1
        );

        multiplier=1000;

    }

    else if(value.endsWith("M")){

        numberPart =
        value.substring(
            0,
            value.length-1
        );

        multiplier=1000000;

    }


    const number =
    Number(numberPart);


    if(isNaN(number)){
        return null;
    }


    return number * multiplier;

}


/* =================================
   CALCULATOR
================================= */

function calculateDiscount(){

    const ratePerText =
    document.getElementById(
        "ratePer"
    ).value.trim();


    const normalRateText =
    document.getElementById(
        "normalRate"
    ).value.trim();


    const quantityText =
    document.getElementById(
        "calcQuantity"
    ).value.trim();


    const setPriceText =
    document.getElementById(
        "setPrice"
    ).value.trim();


    const result =
    document.getElementById(
        "calculatorResult"
    );


    const ratePer =
    convertQuantity(
        ratePerText
    );


    const normalRate =
    Number(normalRateText);


    const quantity =
    convertQuantity(
        quantityText
    );


    const setPrice =
    Number(setPriceText);


    if(
        ratePer === null ||
        ratePer <= 0 ||
        isNaN(normalRate) ||
        normalRate < 0 ||
        quantity === null ||
        quantity <= 0 ||
        isNaN(setPrice) ||
        setPrice < 0
    ){

        result.innerHTML =
        "Please enter valid values.";

        return;

    }


    const normalPrice =
    (quantity / ratePer) *
    normalRate;


    const savedAmount =
    normalPrice - setPrice;


    let discountPercentage=0;


    if(normalPrice > 0){

        discountPercentage =
        (savedAmount /
        normalPrice) * 100;

    }


    if(discountPercentage < 0){
        discountPercentage=0;
    }


    const saving =
    Math.max(
        savedAmount,
        0
    );


    result.innerHTML = `

        <b>Rate Per:</b>
        ${formatNumber(ratePer)}

        <br>

        <b>Customer Quantity:</b>
        ${formatNumber(quantity)}

        <br>

        <b>Normal Price:</b>
        ₹${normalPrice.toFixed(2)}

        <br>

        <b>Set Price:</b>
        ₹${setPrice.toFixed(2)}

        <br>

        <div class="saved-big">

            Saves:
            ₹${saving.toFixed(2)}

        </div>

        <div class="discount-big">

            Offer:
            ${discountPercentage.toFixed(2)}%

        </div>

    `;

}


/* =================================
   FORMAT NUMBER
================================= */

function formatNumber(number){

    return Number(number)
    .toLocaleString("en-IN");

}


/* =================================
   ESCAPE HTML
================================= */

function escapeHTML(value){

    return String(value)

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

}
