<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24online.com</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f6f8;
  color:#111;
}

body{
  user-select:none;
  -webkit-user-select:none;
}

input,textarea,select{
  user-select:text;
  -webkit-user-select:text;
}

/* Top Bar */
.topbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:42px;
  background:#111;
  color:#fff;
  display:flex;
  align-items:center;
  padding-left:18px;
  font-size:18px;
  font-weight:800;
  letter-spacing:.3px;
  z-index:9999;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}

/* Container */
.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:65px 14px 35px;
}

/* Header */
.header{
  background:#fff;
  border-radius:18px;
  padding:22px 18px;
  text-align:left;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
  margin-bottom:16px;
}

.logo{
  font-size:30px;
  font-weight:900;
  margin:0;
}

.tagline{
  margin:7px 0 0;
  color:#666;
  font-size:14px;
}

/* Our Packages Header */
.package-header{
  background:#ffd600;
  border-radius:15px;
  padding:15px;
  margin-bottom:16px;
}

.package-header-title{
  font-size:20px;
  font-weight:900;
}

.package-header-sub{
  font-size:13px;
  margin-top:4px;
  color:#333;
}

/* Free Box */
.free-box{
  background:#fff;
  border-radius:15px;
  padding:14px;
  margin-bottom:18px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.free-title{
  font-size:17px;
  font-weight:900;
}

.free-sub{
  color:#777;
  font-size:13px;
  margin-top:4px;
}

/* Section */
.section-title{
  font-size:18px;
  font-weight:900;
  margin:5px 2px 12px;
}

/* Package Grid */
.packages{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

/* Package Card */
.package-card{
  background:#fff;
  border-radius:13px;
  padding:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
  border:1px solid #eee;
  min-height:205px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.package-name{
  font-size:14px;
  color:#777;
  margin-bottom:8px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.package-details{
  font-size:14px;
  line-height:1.65;
  margin-bottom:7px;
}

.package-details div{
  display:flex;
  justify-content:space-between;
  gap:5px;
}

.package-label{
  color:#777;
}

.package-value{
  font-weight:800;
  text-align:right;
}

.package-price{
  font-size:19px;
  font-weight:900;
  margin-top:5px;
  margin-bottom:7px;
}

.package-offer{
  display:inline-block;
  font-size:10px;
  font-weight:800;
  background:#e8f8e8;
  color:#16851d;
  padding:3px 6px;
  border-radius:6px;
  margin-bottom:8px;
  width:max-content;
}

.buy-btn{
  width:100%;
  border:0;
  background:#ffd600;
  color:#111;
  padding:9px 8px;
  border-radius:9px;
  font-size:13px;
  font-weight:900;
  cursor:pointer;
}

.buy-btn:active{
  transform:scale(.98);
}

/* Loading */
.loading{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:45px 10px;
  color:#777;
}

.spinner{
  width:32px;
  height:32px;
  border:4px solid #ddd;
  border-top-color:#111;
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin-bottom:12px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.empty{
  background:#fff;
  padding:25px 15px;
  text-align:center;
  border-radius:14px;
  color:#777;
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.retry-btn{
  margin-top:12px;
  border:0;
  background:#ffd600;
  padding:9px 18px;
  border-radius:9px;
  font-weight:800;
  cursor:pointer;
}

/* Order Page */
.order-page{
  display:none;
}

.order-box{
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.back-btn{
  border:0;
  background:#eee;
  padding:9px 14px;
  border-radius:9px;
  font-weight:800;
  cursor:pointer;
  margin-bottom:18px;
}

.order-title{
  font-size:22px;
  font-weight:900;
  margin-bottom:18px;
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:6px;
  color:#555;
}

.field input{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  outline:none;
  font-size:14px;
  background:#f8f8f8;
}

.field input:focus{
  border-color:#aaa;
}

.order-btn{
  width:100%;
  margin-top:8px;
  padding:13px;
  border:0;
  border-radius:11px;
  background:#ddd;
  color:#777;
  font-size:15px;
  font-weight:900;
  cursor:not-allowed;
}

.order-btn.active{
  background:#ffd600;
  color:#111;
  cursor:pointer;
}

.note{
  font-size:12px;
  color:#777;
  margin-top:7px;
}

/* Mobile */
@media(max-width:600px){

  .container{
    padding-left:11px;
    padding-right:11px;
  }

  .header{
    padding:19px 15px;
  }

  .logo{
    font-size:27px;
  }

  .packages{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
  }

  .package-card{
    padding:10px;
    min-height:205px;
  }

  .package-details{
    font-size:13px;
  }

  .package-price{
    font-size:17px;
  }

  .buy-btn{
    padding:8px 5px;
  }
}

@media(max-width:360px){

  .packages{
    grid-template-columns:1fr 1fr;
  }

  .package-details{
    font-size:12px;
  }

  .package-card{
    min-height:200px;
  }
}
</style>
</head>

<body>

<div class="topbar">
  24online.Com
</div>

<div class="container">

  <!-- HOME PAGE -->
  <div id="homePage">

    <div class="header">
      <h1 class="logo">24online.com</h1>
      <p class="tagline">
        100% Real Service And Trusted Website.
      </p>
    </div>

    <!-- ONLY OUR PACKAGES -->
    <div class="package-header">
      <div class="package-header-title">
        Our Packages
      </div>

      <div class="package-header-sub">
        Choose your package and place your order easily.
      </div>
    </div>

    <div class="free-box">
      <div class="free-title">
        Free 1000 Views
      </div>

      <div class="free-sub">
        Try our service before purchasing.
      </div>
    </div>

    <div class="section-title">
      Our Packages
    </div>

    <div id="packageArea">

      <div class="loading">
        <div class="spinner"></div>
        <div>Loading packages...</div>
      </div>

    </div>

  </div>


  <!-- ORDER PAGE -->
  <div class="order-page" id="orderPage">

    <div class="order-box">

      <button class="back-btn" onclick="backHome()">
        ← Back
      </button>

      <div class="order-title">
        Place Your Order
      </div>

      <div class="field">
        <label>Package Name</label>
        <input id="orderPackage" readonly>
      </div>

      <div class="field">
        <label>Views</label>
        <input id="orderViews" readonly>
      </div>

      <div class="field">
        <label>Likes</label>
        <input id="orderLikes" readonly>
      </div>

      <div class="field">
        <label>Shares</label>
        <input id="orderShares" readonly>
      </div>

      <div class="field">
        <label>Price</label>
        <input id="orderPrice" readonly>
      </div>

      <div class="field">

        <label>
          Paste Your Instagram Reels/Post Link
        </label>

        <input
          type="url"
          id="instagramLink"
          placeholder="Paste Instagram link"
          oninput="checkInstagramLink()"
        >

        <div class="note">
          Enter a valid Instagram Post or Reel link.
        </div>

      </div>

      <button
        class="order-btn"
        id="orderBtn"
        onclick="placeOrder()"
        disabled
      >
        Order Now
      </button>

    </div>

  </div>

</div>


<script>

const FIREBASE_URL =
  "https://datacash-95a80-default-rtdb.firebaseio.com";

const WHATSAPP_NUMBER =
  "9085495628";

let selectedPackage = null;


/* -----------------------------
   Fetch With Timeout
----------------------------- */

async function fetchWithTimeout(url, timeout = 9000){

  const controller =
    new AbortController();

  const timer =
    setTimeout(() => {
      controller.abort();
    }, timeout);

  try{

    const response =
      await fetch(url,{
        method:"GET",
        cache:"no-store",
        signal:controller.signal
      });

    clearTimeout(timer);

    if(!response.ok){

      throw new Error(
        "HTTP " + response.status
      );

    }

    return await response.json();

  }catch(error){

    clearTimeout(timer);

    throw error;

  }
}


/* -----------------------------
   Load Our Packages
----------------------------- */

async function loadPackages(){

  const area =
    document.getElementById("packageArea");

  area.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <div>Loading packages...</div>
    </div>
  `;

  try{

    /*
      Packages are loaded from:

      /packages
    */

    const url =
      `${FIREBASE_URL}/packages.json?t=${Date.now()}`;

    const data =
      await fetchWithTimeout(url,9000);

    area.innerHTML = "";

    if(!data){

      showEmpty(area);
      return;

    }

    const entries =
      Object.entries(data);

    if(entries.length === 0){

      showEmpty(area);
      return;

    }

    const grid =
      document.createElement("div");

    grid.className = "packages";

    entries.forEach(([id,pkg]) => {

      if(!pkg) return;

      const card =
        createPackageCard(pkg);

      grid.appendChild(card);

    });

    if(grid.children.length === 0){

      showEmpty(area);
      return;

    }

    area.appendChild(grid);

  }catch(error){

    console.error(error);

    let message =
      "Connection is taking too long. Please try again.";

    if(
      error.message &&
      error.message.includes("401")
    ){

      message =
        "Database permission denied.";

    }

    if(
      error.message &&
      error.message.includes("403")
    ){

      message =
        "Database access is blocked.";

    }

    area.innerHTML = `
      <div class="empty">
        ${message}
        <br>

        <button
          class="retry-btn"
          onclick="loadPackages()"
        >
          Retry
        </button>

      </div>
    `;

  }

}


/* -----------------------------
   Empty
----------------------------- */

function showEmpty(area){

  area.innerHTML = `
    <div class="empty">
      No packages available right now.
    </div>
  `;

}


/* -----------------------------
   Create Package Card
----------------------------- */

function createPackageCard(pkg){

  const card =
    document.createElement("div");

  card.className =
    "package-card";

  const packageName =
    pkg.packageName || "Package";

  const views =
    pkg.views || "-";

  const likes =
    pkg.likes || "-";

  const shares =
    pkg.shares || "-";

  const price =
    pkg.price !== undefined
      ? pkg.price
      : "";

  const offer =
    pkg.offer !== undefined &&
    pkg.offer !== ""
      ? pkg.offer
      : "";


  let offerHTML = "";

  if(offer !== ""){

    offerHTML = `
      <div class="package-offer">
        ${escapeHTML(String(offer))}% OFF
      </div>
    `;

  }


  card.innerHTML = `

    <div>

      <div class="package-name">
        ${escapeHTML(String(packageName))}
      </div>

      <div class="package-details">

        <div>
          <span class="package-label">
            Views
          </span>

          <span class="package-value">
            ${escapeHTML(String(views))}
          </span>
        </div>


        <div>
          <span class="package-label">
            Likes
          </span>

          <span class="package-value">
            ${escapeHTML(String(likes))}
          </span>
        </div>


        <div>
          <span class="package-label">
            Shares
          </span>

          <span class="package-value">
            ${escapeHTML(String(shares))}
          </span>
        </div>

      </div>


      <div class="package-price">
        ₹${escapeHTML(String(price))}
      </div>

      ${offerHTML}

    </div>


    <button class="buy-btn">
      Buy Now
    </button>

  `;


  card
    .querySelector(".buy-btn")
    .addEventListener(
      "click",
      () => openOrder(pkg)
    );


  return card;

}


/* -----------------------------
   Escape HTML
----------------------------- */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* -----------------------------
   Open Order
----------------------------- */

function openOrder(pkg){

  selectedPackage =
    pkg;

  document.getElementById(
    "homePage"
  ).style.display = "none";

  document.getElementById(
    "orderPage"
  ).style.display = "block";


  document.getElementById(
    "orderPackage"
  ).value =
    pkg.packageName || "";


  document.getElementById(
    "orderViews"
  ).value =
    pkg.views || "";


  document.getElementById(
    "orderLikes"
  ).value =
    pkg.likes || "";


  document.getElementById(
    "orderShares"
  ).value =
    pkg.shares || "";


  document.getElementById(
    "orderPrice"
  ).value =
    "₹" + (pkg.price || "");


  document.getElementById(
    "instagramLink"
  ).value = "";


  resetOrderButton();


  window.scrollTo({
    top:0,
    behavior:"instant"
  });

}


/* -----------------------------
   Back Home
----------------------------- */

function backHome(){

  document.getElementById(
    "orderPage"
  ).style.display = "none";

  document.getElementById(
    "homePage"
  ).style.display = "block";


  document.getElementById(
    "instagramLink"
  ).value = "";


  resetOrderButton();


  window.scrollTo({
    top:0,
    behavior:"instant"
  });

}


/* -----------------------------
   Instagram Post/Reel URL
----------------------------- */

function isValidPostOrReelURL(value){

  try{

    const url =
      new URL(value.trim());

    const host =
      url.hostname
        .toLowerCase()
        .replace(/^www\./,"");


    if(
      host !== "instagram.com" &&
      host !== "instagr.am"
    ){

      return false;

    }


    const parts =
      url.pathname
        .split("/")
        .filter(Boolean);


    if(parts.length !== 2){

      return false;

    }


    const type =
      parts[0].toLowerCase();


    if(
      type !== "p" &&
      type !== "reel" &&
      type !== "reels"
    ){

      return false;

    }


    return /^[A-Za-z0-9_-]+$/.test(
      parts[1]
    );

  }catch(e){

    return false;

  }

}


/* -----------------------------
   Check Instagram Link
----------------------------- */

function checkInstagramLink(){

  const input =
    document.getElementById(
      "instagramLink"
    );

  const button =
    document.getElementById(
      "orderBtn"
    );

  const value =
    input.value.trim();


  if(!selectedPackage){

    resetOrderButton();
    return;

  }


  const valid =
    isValidPostOrReelURL(value);


  if(valid){

    button.disabled = false;

    button.classList.add(
      "active"
    );

  }else{

    resetOrderButton();

  }

}


/* -----------------------------
   Reset Order Button
----------------------------- */

function resetOrderButton(){

  const button =
    document.getElementById(
      "orderBtn"
    );

  button.disabled = true;

  button.classList.remove(
    "active"
  );

}


/* -----------------------------
   Place Order
----------------------------- */

function placeOrder(){

  if(!selectedPackage){

    return;

  }


  const link =
    document.getElementById(
      "instagramLink"
    ).value.trim();


  if(!isValidPostOrReelURL(link)){

    alert(
      "Please enter a valid Instagram Post/Reel link."
    );

    return;

  }


  const message =

`Hello 24online.com 👋

I want to place an order.

Package: ${selectedPackage.packageName || ""}

Views: ${selectedPackage.views || ""}
Likes: ${selectedPackage.likes || ""}
Shares: ${selectedPackage.shares || ""}

Price: ₹${selectedPackage.price || ""}

Instagram Post/Reel Link: ${link}

Please confirm my order.`;


  const whatsappURL =
    "https://wa.me/" +
    WHATSAPP_NUMBER +
    "?text=" +
    encodeURIComponent(message);


  window.location.href =
    whatsappURL;

}


/* -----------------------------
   Disable Copy / Right Click
----------------------------- */

document.addEventListener(
  "contextmenu",
  function(e){

    if(
      e.target.tagName !== "INPUT" &&
      e.target.tagName !== "TEXTAREA" &&
      e.target.tagName !== "SELECT"
    ){

      e.preventDefault();

    }

  }
);


document.addEventListener(
  "keydown",
  function(e){

    const tag =
      e.target.tagName;

    const isInput =
      tag === "INPUT" ||
      tag === "TEXTAREA" ||
      tag === "SELECT";


    if(isInput) return;


    if(
      (e.ctrlKey || e.metaKey) &&
      ["c","x","a"].includes(
        e.key.toLowerCase()
      )
    ){

      e.preventDefault();

    }

  }
);


document.addEventListener(
  "dragstart",
  function(e){

    if(
      e.target.tagName !== "INPUT" &&
      e.target.tagName !== "TEXTAREA"
    ){

      e.preventDefault();

    }

  }
);


/* -----------------------------
   Initial Load
----------------------------- */

loadPackages();

</script>

</body>
</html>
